<html>
    <head>
        <title>Tiendita</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    </head>
    <body class="bg-light mt-5">

        <div class="container">
            <div class="row g-4">
                
                <!-- Formulario de Registro -->
                <div class="col-md-4">
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-white font-weight-bold fw-bold">
                            <i class="me-1 text-primary"></i> Registrar Producto
                        </div>
                        <div class="card-body">
                            <form id="formProducto">
                                <div class="mb-3">
                                   
                                    <label for="nombre" class="form-label">Nombre del Producto</label>
                                    <input type="text" class="form-control" id="nombre" placeholder="Ej. Leche 1L" required>
                                </div>
                                <div class="mb-3">
                                    <label for="precio" class="form-label">Precio ($)</label>
                                    <input type="number" step="0.5" class="form-control" id="precio" placeholder="25.00" required>
                                </div>
                                <div class="mb-3">
                                    <label for="cantidad" class="form-label">Cantidad Disponible</label>
                                    <input type="number" class="form-control" id="cantidad" placeholder="10" required>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">
                                    <i class="bi bi-save me-1"></i> Guardar Producto
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Tarjeta de Venta Relámpago -->
                <div class="col-md-4 mt-4">
                    <div class="card shadow-sm border-0 bg-warning bg-opacity-10">
                        <div class="card-header bg-warning font-weight-bold fw-bold text-dark">
                            <i class="bi bi-lightning-charge-fill me-1"></i> Venta Relampago
                        </div>
                        <div class="card-body text-center">
                            <p class="small text-muted">Linternas con descuento del 50%.</p>
                            <button onclick="comprarRelampago(3)" class="btn btn-danger w-100 fw-bold">
                            ¡COMPRA UNA LINTERNA AHORA!
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Tabla de Inventario -->
                <div class="col-md-8">
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-white fw-bold d-flex justify-content-between align-items-center">
                            <span><i class="me-1 text-primary"></i> Catálogo de Productos</span>
                            <span class="badge bg-secondary" id="totalProductos">0 productos</span>
                        </div>
                        <div class="card-body p-0">
                            <div class="table-responsive">
                                <table class="table table-hover align-middle mb-0">
                                    <thead class="table-light">
                                        <tr>
                                            <th>ID</th>
                                            <th>Producto</th>
                                            <th>Precio</th>
                                            <th>Cantidad</th>
                                            <th class="text-end me-3">Acciones</th>
                                        </tr>
                                    </thead>
                                    <tbody id="tablaProductos">
                                        <!-- Las filas se cargan dinámicamente con JavaScript -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
                                <!-- Sección del Dashboard -->
                <div class="container my-4">
                    <h3 class="mb-3">Dashboard Analítico</h3>
                    
                    <!-- Tarjetas de KPIs -->
                    <div class="row mb-4">
                        <div class="col-md-4">
                            <div class="card bg-light border-primary mb-3">
                                <div class="card-body text-center">
                                    <h5 class="card-title">Ingresos Totales</h5>
                                    <!-- Aquí JS inyectará el dato usando el ID -->
                                    <h2 class="card-text text-primary" id="kpiIngresos">$0.00</h2>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card bg-light border-success mb-3">
                                <div class="card-body text-center">
                                    <h5 class="card-title">Total de Transacciones</h5>
                                    <!-- Aquí JS inyectará el dato usando el ID -->
                                    <h2 class="card-text text-success" id="kpiTransacciones">0</h2>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card bg-light border-warning mb-3">
                                <div class="card-body text-center">
                                    <h5 class="card-title">Producto Estrella (ID)</h5>
                                    <!-- Aquí JS inyectará el dato usando el ID -->
                                    <h2 class="card-text text-warning" id="kpiEstrella">N/A</h2>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Gráfica de Chart.js -->
                    <div class="row">
                        <div class="col-md-6">
                            <div class="card">
                                <div class="card-body">
                                    <!-- Aquí se dibujará la gráfica usando el ID miCanvas -->
                                    <canvas id="miCanvas" height="100"></canvas>
                                </div>
                            </div>
                        </div>
                    
                        <div class="col-md-6">
                            <div class="card mb-3">
                                <div class="card-body">
                                    <canvas id="graficaLineas"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                </div>

            </div>
        </div>

        <!-- Bootstrap JS Bundle -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

        <script src="app.js"></script>
        <style>
            body {
                /* Reemplaza 'fondo.jpg' con el nombre de tu imagen o una URL web */
                background-image: url('https://previews.123rf.com/images/krekdm/krekdm1607/krekdm160700341/61905808-seamless-pattern-of-camping-gear-elements-can-be-used-for-wallpaper-website-background-wrapping.jpg'); 
                
                /* Ajusta la imagen para que cubra toda la pantalla sin deformarse */
                background-size: cover; 
                
                /* Centra la imagen */
                background-position: center center; 
                
                /* Evita que la imagen se repita como mosaico */
                background-repeat: no-repeat; 
                
                /* Hace que el fondo se quede fijo al hacer scroll (opcional) */
                background-attachment: fixed;           
            }

            /* Opcional: Agregar un fondo semi-transparente a la tabla y tarjetas para que el texto siga siendo legible */
            .container, .card, table {
                background-color: rgba(255, 255, 255, 0.449) !important;
                border-radius: 10px;
            }
        </style>
    </body>
</html>
